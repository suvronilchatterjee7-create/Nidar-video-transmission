# CI for NIDAR RescueSwarm: lint + fast tests (including the traceability gate) on every push / PR.
# Network is used here only to install dev tools; the runtime package has no network dependency [BRIEF §5].
# The slow Monte-Carlo reproductions run locally with `python tools/check.py --full`.
name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check.py
